# Minimal 32K NROM iNES ROM, no CHR needed (veloce_smoke never touches the PPU).
MEMORY {
    ZP:     start = $10,   size = $F0;
    RAM:    start = $200,  size = $200;
    HEADER: start = 0,     size = $10,   fill = yes;
    ROM:    start = $8000, size = $7FFA, fill = yes, fillval = $FF;
    VECTORS:start = $FFFA, size = 6,     fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss;
    HEADER:   load = HEADER,  type = ro;
    CODE:     load = ROM,     type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
