# ca65/ld65 linker config for veloce_smoke.sfc: a 32KB LoROM image, no SRAM,
# no bank-switching (everything fits in one bank at $8000-$FFFF).
MEMORY {
    ZP:     start = $0000, size = $100,  type = rw;
    RAM:    start = $0200, size = $1E00, type = rw;
    ROM:    start = $8000, size = $7FC0, type = ro, fill = yes, fillval = $00;
    HEADER: start = $FFC0, size = $40,   type = ro, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss;
    CODE:     load = ROM,    type = ro;
    HEADER:   load = HEADER, type = ro;
}
