name: Accuracy

# Cross-console test + accuracy-measurement CI for the Veloce emulator platform.
# Jobs run only on a self-hosted runner ([self-hosted, linux]); the project does
# not use GitHub-hosted runners. With no runner registered, jobs just queue.
# Two tiers:
#   * fast-gates : pure-logic unit test + config schema validation (every push/PR)
#   * accuracy   : full per-console ROM suites + aggregate scorecard (needs build
#                  + network for test ROMs). Runs on PRs to main and nightly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly aggregate scorecard
  workflow_dispatch:

jobs:
  fast-gates:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Testkit self-test (pure logic)
        run: python3 tests/veloce_testkit/selftest.py
      - name: Validate all test_config.json
        run: python3 tests/validate_configs.py
      - name: Result-file sink unit test (C++, no SDL)
        run: |
          g++ -std=c++17 -Wall -Wextra -Iinclude -Isrc \
            tests/cpp/test_file_sink_test.cpp src/core/test_file_sink.cpp -o test_file_sink
          ./test_file_sink

  accuracy:
    needs: fast-gates
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        console: [nes, snes, gb, gba]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Self-hosted runner: build tools must already be installed on the
      # runner machine (cmake >= 3.20, a C++20 compiler, python3). Nothing is
      # installed here, so a job never needs sudo.
      - name: Check build prerequisites
        run: |
          command -v cmake && command -v python3 && command -v c++
      - name: Build veloce (headless)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target veloce -j
      - name: Run ${{ matrix.console }} accuracy suite
        run: |
          python3 cores/${{ matrix.console }}/tests/test_runner.py --json \
            | tee scorecard-${{ matrix.console }}.json
      - name: Upload scorecard + artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ matrix.console }}
          # artifacts/: VELOCE_TEST_OUT result files (+ blobs), screenshots and
          # traces from the shared harness; screenshots/: older runners.
          path: |
            scorecard-${{ matrix.console }}.json
            cores/${{ matrix.console }}/tests/artifacts/
            cores/${{ matrix.console }}/tests/screenshots/

  aggregate:
    needs: accuracy
    if: always() && github.event_name != 'push'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: scorecards
      # Aggregation note: run_all.py normally invokes each runner itself; in CI we
      # already have per-console JSON artifacts, so a follow-up step (owned by the
      # platform agent) can merge them. The platform scorecard gate lives here:
      - name: Platform scorecard (regression gate stub)
        run: |
          echo "Aggregate scorecards collected under scorecards/."
          echo "Wire --baseline / --no-regressions once a baseline scorecard.json is committed."
